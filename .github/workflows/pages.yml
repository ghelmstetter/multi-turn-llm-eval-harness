# Publishes the site to GitHub Pages: docs/ at the root, plus the engine (src/) and the example
# suites, so the web app in docs/app runs the same code as the CLI. Same layout as
# `npm run app` locally. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp -r src _site/src
          cp -r suites _site/suites
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
